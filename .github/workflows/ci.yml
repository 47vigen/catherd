name: CI

# The one gate. A change is tested here, on its pull request, and nowhere else: release.yml trusts it and never
# re-runs the matrix. Branch protection requires the `ci` job alone, which reports on every PR, docs-only included.
on:
  pull_request:
    branches: [main, beta]
  # nightly on main: the full matrix, with macOS on the Bun floor, and a new Bun caught with no PR open
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

# a new push to a PR cancels its previous run
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # code = anything the tests, the typecheck or the package read. Docs, specs, plans, ideas and changesets are
      # not code; the release PR (only version stamps, CHANGELOG and removed changesets, written by
      # `bun run version-packages`) is not code either: its package job still packs and runs the new version.
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -z "$PR" ]; then code=true
          elif [ "$HEAD_REF" = changeset-release/main ]; then code=false
          elif gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate -q '.[].filename' |
            grep -qE '^(src|test|catalog|plugin|scripts|\.github)/|^(package\.json|bun\.lock|bunfig\.toml|tsconfig\.json|\.oxfmtrc\.json|docs/tui-frames\.md)$'
          then code=true
          else code=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # oxfmt also checks the Markdown and YAML outside docs/, so even a docs-only PR runs it (about 20 s)
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run format:check

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # spec §12: {ubuntu, macOS} × {Bun 1.4.0, latest}. 1.4.0 is the floor catherd's runtime guard allows; latest
    # catches a new Bun before users do. bun.lock pins everything else. PRs skip macOS × 1.4.0: the Bun floor is
    # a runtime question, not a platform one, and ubuntu × 1.4.0 covers it. macOS stays on PRs with the latest
    # Bun, since most users run catherd on macOS (tmux, process groups and paths differ there). The nightly run
    # restores the fourth cell. The repo is public, so macOS minutes cost nothing; what it costs is ~1 min of
    # wall clock, which the parallel ubuntu jobs mostly hide.
    name: ${{ matrix.os }} · Bun ${{ matrix.bun }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        bun: ["1.4.0", latest]
        exclude:
          - os: macos-latest
            bun: ${{ github.event_name == 'pull_request' && '1.4.0' || 'none' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: tmux, for the TUI's terminal test (spec §11.6; it skips without tmux)
        run: |
          command -v tmux && exit 0
          if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get update && sudo apt-get install -y tmux; fi
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      # every non-live test: the architecture test and docs/tui-frames.md's freshness are among them
      - if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.bun == 'latest') }}
        run: bun test
      - name: bun test, with the coverage floor over src/
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.bun == 'latest' }}
        run: |
          bun test --coverage --coverage-reporter=text --coverage-reporter=lcov
          bun test/coverage-floor.ts coverage/lcov.info

  package:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.head_ref == 'changeset-release/main'
    name: package · audit and npm pack smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: dependency audit (spec §12)
        run: bun audit --audit-level=high
      - name: npm pack smoke (spec §12)
        run: bun test/pack-smoke.ts

  # the required status check: green when every job that ran passed, so a docs-only PR is never blocked
  ci:
    name: ci
    needs: [changes, format, check, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
