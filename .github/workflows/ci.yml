name: CI

# The one gate. A change is tested here, on its pull request, and nowhere else: release.yml trusts it and never
# re-runs the suite. Branch protection requires the `ci` job alone, which reports on every PR, docs-only included.
# A PR runs on one OS with the latest Bun, the suite split in parallel shards (scripts/test-shard.ts). The nightly
# run on main (or a manual one) runs the whole suite in one process on macOS, and on Linux with the coverage floor.
on:
  pull_request:
    branches: [main]
  # nightly on main: everything, whole-suite, on macOS and on Linux with coverage; a new Bun is caught with no PR open
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  # release.yml, for a pushed commit that no green PR tested
  workflow_call:

# a new push to a PR cancels its previous run
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      static: ${{ steps.diff.outputs.static }}
      web: ${{ steps.diff.outputs.web }}
      package: ${{ steps.diff.outputs.package }}
      audit: ${{ steps.diff.outputs.audit }}
      skills: ${{ steps.diff.outputs.skills }}
      workflows: ${{ steps.diff.outputs.workflows }}
      release: ${{ steps.diff.outputs.release }}
      full: ${{ steps.diff.outputs.full }}
    steps:
      # Each job runs only when a change can break it. A PR is judged by its files, a push from release.yml by its
      # diff (a compare that hits the API's 300-file cap counts as everything), and a nightly, a manual run or a
      # list that is empty is everything. A failed file listing fails the job, so the gate never passes on a guess.
      # A rename counts under both of its paths.
      #   code      the tests, the typecheck, lint: src, test, catalog, scripts, the manifest, lockfile, tool configs
      #   static    the format check: everything but docs/ (oxfmt ignores it) and workflows other than this one
      #   web       the panel: web/, and what its e2e server imports (src/, test/helpers.ts, its own server)
      #   package   what npm pack ships and checks: src, plugin, web, scripts, manifest, lockfile, notices
      #   audit     only a manifest or lockfile change can add a vulnerable dependency
      #   skills    plugin/, scorecard/ and the plugin manifest: tests that read repo files outside src/
      #   workflows .github/: actionlint
      # The release PR is not code, but only when it is this repository's own changeset-release/main (a fork can
      # take the name) and it touches only what `bun run version-packages` writes: version stamps, CHANGELOG and
      # removed changesets. Its package job still packs and runs the new version.
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          full=false files=''
          case "$GITHUB_EVENT_NAME" in schedule | workflow_dispatch) full=true ;; esac
          if [ -n "$PR" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate -q '.[] | .filename, .previous_filename // empty')
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ -n "${BEFORE//0/}" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" \
              -q 'if (.files | length) >= 300 then "*" else .files[] | .filename, .previous_filename // empty end')
          fi
          any() { grep -qE "$1" <<<"$files" && echo true || echo false; }
          release=false
          if [ "$full" = true ] || [ -z "$files" ] || [ "$files" = '*' ]; then
            code=true static=true web=true package=true audit=true skills=true workflows=true
          else
            code=$(any '^(src|test|catalog|scripts)/|^(package\.json|bun\.lock|bunfig\.toml|tsconfig\.json|web/openapi\.json)$')
            web=$(any '^(web|src)/|^test/(helpers|panel-e2e-serve)\.ts$|^(package\.json|bun\.lock)$')
            package=$(any '^(src|plugin|scripts|web|\.claude-plugin)/|^(package\.json|bun\.lock|THIRD_PARTY_NOTICES\.md|LICENSE)$')
            audit=$(any '^(package\.json|bun\.lock)$')
            skills=$(any '^(plugin|scorecard|\.claude-plugin)/')
            workflows=$(any '^\.github/')
            static=false
            if grep -qvE '^(docs/|\.github/)' <<<"$files" || grep -qE '^\.github/(workflows/ci\.yml|actions/)' <<<"$files"; then
              static=true
            fi
            stamped='^(\.changeset/[^/]+\.md|CHANGELOG\.md|package\.json|\.claude-plugin/marketplace\.json|plugin/\.claude-plugin/plugin\.json|plugin/bin/catherd-mcp|plugin/skills/catherd/SKILL\.md)$'
            if [ "$HEAD_REF" = changeset-release/main ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] &&
              ! grep -qvE "$stamped" <<<"$files"; then
              code=false web=false audit=false skills=false workflows=false package=true release=true
            fi
          fi
          printf '%s\n' "code=$code" "static=$static" "web=$web" "package=$package" "audit=$audit" \
            "skills=$skills" "workflows=$workflows" "release=$release" "full=$full" | tee -a "$GITHUB_OUTPUT"

  # one runner, one install: oxfmt also checks the Markdown and YAML outside docs/, so a PR that touches them runs
  # the format check even without code (typecheck and lint only when code changed). A PR of docs/ alone skips it.
  static:
    needs: changes
    if: needs.changes.outputs.static == 'true'
    name: static · format, types, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run format:check
      - if: needs.changes.outputs.code == 'true'
        run: bun run typecheck
      - if: needs.changes.outputs.code == 'true'
        run: bun run lint

  # a pull request: every non-live test (the architecture test is among them), in parallel shards balanced by
  # test/timings.json. The shard count is the matrix size; scripts/test-shard.ts takes it from strategy.job-total.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full != 'true'
    name: test · shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun scripts/test-shard.ts ${{ matrix.shard }} ${{ strategy.job-total }}

  # a change to the plugin, the skills or the scorecard fixtures reaches only the tests that read those files; with
  # code changed too, the shards already run them
  plugin:
    needs: changes
    if: needs.changes.outputs.skills == 'true' && needs.changes.outputs.code != 'true' && needs.changes.outputs.full != 'true'
    name: test · plugin and skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: >-
          bun test test/skills.test.ts test/plugin.test.ts test/wait-residue.test.ts test/scorecard-fixtures.test.ts
          test/scorecard-shim.test.ts test/entry/plugin-packaging.test.ts test/entry/mcp-handshake.test.ts

  # the nightly and manual run: the whole suite in one process. macOS because most users run catherd there (process
  # groups and paths differ); Linux with the coverage floor over src/, which needs the one process.
  full:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: full · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - if: matrix.os != 'ubuntu-latest'
        run: bun test
      - name: bun test, with the coverage floor over src/
        if: matrix.os == 'ubuntu-latest'
        run: |
          bun test --coverage --coverage-reporter=text --coverage-reporter=lcov
          bun test/coverage-floor.ts coverage/lcov.info

  # the panel (web/): its own gate, one build, and the e2e against a seeded server (no model, no daemon, no backend)
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: web · gate and e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # the e2e server imports catherd's own source, so the root installs too
      - uses: ./.github/actions/setup
        with:
          web: true
      - run: bun run typecheck
        working-directory: web
      - run: bun run lint
        working-directory: web
      - run: bun run format:check
        working-directory: web
      - run: bun run test
        working-directory: web
      - run: bun run build
        working-directory: web
      - run: bunx playwright install --with-deps chromium
        working-directory: web
      - run: bun run e2e
        working-directory: web

  package:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    name: package · audit and npm pack smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # a finding fails the job; npm's advisory service being down (5xx or no answer) is a warning, not a block
      - name: dependency audit (spec §12)
        if: needs.changes.outputs.audit == 'true'
        timeout-minutes: 8
        run: |
          for _ in 1 2 3; do
            code=0
            timeout 120 bun audit --audit-level=high >audit.log 2>&1 || code=$?
            cat audit.log
            [ "$code" = 0 ] && exit 0
            if ! grep -qE 'advisories/bulk - 5[0-9][0-9]' audit.log && [ "$code" != 124 ]; then exit "$code"; fi
            sleep 20
          done
          echo "::warning::npm's advisory service did not answer; the dependency audit was skipped"
      - name: npm pack smoke (spec §12)
        run: bun test/pack-smoke.ts

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  # the required status check: green when every job that ran passed, so a docs-only PR is never blocked
  ci:
    name: ci
    needs: [changes, static, test, plugin, full, web, package, actionlint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
